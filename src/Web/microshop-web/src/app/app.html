<mat-toolbar class="toolbar">
  <a class="brand" routerLink="/">
    <mat-icon>storefront</mat-icon>
    <span>MicroShop</span>
  </a>

  <nav class="nav">
    <a mat-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Shop</a>
    <a mat-button routerLink="/orders" routerLinkActive="active">Orders</a>
    <a mat-button routerLink="/admin/products" routerLinkActive="active">Admin</a>
  </nav>

  <span class="spacer"></span>

  <a mat-icon-button routerLink="/cart" aria-label="Cart">
    <mat-icon [matBadge]="cart.count()" [matBadgeHidden]="cart.count() === 0" matBadgeColor="accent">
      shopping_cart
    </mat-icon>
  </a>
</mat-toolbar>

<main class="page">
  <router-outlet />
</main>

<footer class="footer">
  Calls the API gateway at <code>{{ gatewayUrl }}</code> ·
  <a [href]="dashboardUrl" target="_blank" rel="noopener">Aspire Dashboard</a>
</footer>
