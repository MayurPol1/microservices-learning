<div class="page-header">
  <h1>Products (admin)</h1>
  <span class="spacer"></span>
  <a mat-flat-button routerLink="/admin/products/new"><mat-icon>add</mat-icon> New product</a>
</div>

@if (products(); as list) {
  <table mat-table [dataSource]="list">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let p">{{ p.name }}</td>
    </ng-container>
    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef>Category</th>
      <td mat-cell *matCellDef="let p">{{ p.category }}</td>
    </ng-container>
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>Price</th>
      <td mat-cell *matCellDef="let p">{{ p.price | currency }}</td>
    </ng-container>
    <ng-container matColumnDef="stock">
      <th mat-header-cell *matHeaderCellDef>Stock</th>
      <td mat-cell *matCellDef="let p" [class.low]="p.availableStock <= 3">{{ p.availableStock }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let p" class="actions">
        <a mat-icon-button [routerLink]="['/admin/products', p.id, 'edit']" matTooltip="Edit" [attr.aria-label]="'Edit ' + p.name">
          <mat-icon>edit</mat-icon>
        </a>
        <button mat-icon-button (click)="restock(p)" matTooltip="Restock" [attr.aria-label]="'Restock ' + p.name">
          <mat-icon>inventory</mat-icon>
        </button>
        <button mat-icon-button (click)="delete(p)" matTooltip="Delete" [attr.aria-label]="'Delete ' + p.name">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
} @else {
  <mat-progress-bar mode="indeterminate" />
}
