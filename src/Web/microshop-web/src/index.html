<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MicroShop</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <!-- Apply the saved light/dark choice before anything is drawn, so a dark page doesn't flash white.
         ThemeStore (core/theme-store.ts) keeps it up to date afterwards. -->
    <script>
      try {
        var mode = localStorage.getItem('microshop.theme');
        if (mode === 'light' || mode === 'dark') document.documentElement.style.colorScheme = mode;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
