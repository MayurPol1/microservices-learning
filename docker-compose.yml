# One command starts the whole system:  docker compose up --build
# Each service runs in its own container; containers find each other by service name
# (for example http://catalog-api:8080) on the private network compose creates.
#
# Passwords are inline to keep the learning project simple. Real deployments read them
# from a secret store (Docker/Kubernetes secrets, Azure Key Vault, ...).

name: microshop

services:

  # ---------------------------------------------------------------- API gateway
  # The only service a client needs to know: http://localhost:5000
  gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      # Override the localhost addresses in appsettings.json with compose service names.
      ReverseProxy__Clusters__catalog__Destinations__primary__Address: "http://catalog-api:8080/"
      ReverseProxy__Clusters__orders__Destinations__primary__Address: "http://orders-api:8080/"
      ReverseProxy__Clusters__notifications__Destinations__primary__Address: "http://notifications-api:8080/"
      ReverseProxy__Clusters__identity__Destinations__primary__Address: "http://identity-api:8080/"
    ports:
      - "5000:8080"
    depends_on:
      - catalog-api
      - orders-api
      - notifications-api
      - identity-api
    restart: unless-stopped

  # ---------------------------------------------------------------- Observability
  # Receives traces, metrics and logs (OTLP) from every service and shows them in one UI.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    environment:
      # Learning setup: no login for the UI, no API key for incoming telemetry.
      Dashboard__Frontend__AuthMode: Unsecured
      Dashboard__Otlp__AuthMode: Unsecured
    ports:
      - "18888:18888"           # dashboard UI: http://localhost:18888
      - "4317:18889"            # OTLP/gRPC, for services you run from Visual Studio (see launchSettings.json)

  # ---------------------------------------------------------------- Message broker
  rabbitmq:
    image: rabbitmq:4.3-management
    hostname: rabbitmq          # RabbitMQ stores data per node name, which comes from the hostname
    environment:
      RABBITMQ_DEFAULT_USER: microshop
      RABBITMQ_DEFAULT_PASS: microshop_pw
    ports:
      - "5672:5672"             # AMQP, used by the services
      - "15672:15672"           # management UI: http://localhost:15672  (microshop / microshop_pw)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ---------------------------------------------------------------- Catalog
  catalog-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_pw
      MYSQL_DATABASE: catalog
      MYSQL_USER: catalog
      MYSQL_PASSWORD: catalog_pw
    ports:
      - "13306:3306"            # host port 13306 so it doesn't clash with a local MySQL on 3306
    volumes:
      - catalog-db-data:/var/lib/mysql
    healthcheck:
      # TCP ping only succeeds once MySQL has finished its first-start initialisation.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  catalog-api:
    build:
      context: .
      dockerfile: src/Services/Catalog.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      ConnectionStrings__CatalogDb: "Server=catalog-db;Port=3306;Database=catalog;User Id=catalog;Password=catalog_pw;AllowPublicKeyRetrieval=True"
      # Resilience demo (README, experiment 3). From PowerShell:
      #   $env:CATALOG_FAILURE_RATE = "0.5"; docker compose up -d catalog-api
      Chaos__FailureRate: "${CATALOG_FAILURE_RATE:-0}"
      Chaos__ExtraLatencyMs: "${CATALOG_EXTRA_LATENCY_MS:-0}"
      RabbitMq__HostName: rabbitmq
    ports:
      - "5101:8080"             # exposed for learning (Swagger); in production only the gateway is public
    depends_on:
      catalog-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------- Orders
  orders-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_pw
      MYSQL_DATABASE: orders
      MYSQL_USER: orders        # a different user: Orders can't even log in to Catalog's database
      MYSQL_PASSWORD: orders_pw
    ports:
      - "13307:3306"
    volumes:
      - orders-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  orders-api:
    build:
      context: .
      dockerfile: src/Services/Orders.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      ConnectionStrings__OrdersDb: "Server=orders-db;Port=3306;Database=orders;User Id=orders;Password=orders_pw;AllowPublicKeyRetrieval=True"
      Services__Catalog: "http://catalog-api:8080/"
      RabbitMq__HostName: rabbitmq
    ports:
      - "5102:8080"
    depends_on:
      orders-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog-api:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------- Notifications
  # No database: it only reacts to events and keeps the last 100 "emails" in memory.
  notifications-api:
    build:
      context: .
      dockerfile: src/Services/Notifications.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      RabbitMq__HostName: rabbitmq
    ports:
      - "5103-5104:8080"        # a range, so `docker compose up -d --scale notifications-api=2` works
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------- Identity
  # Users, passwords (hashed) and JWT issuing. The only service that knows who users are.
  identity-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_pw
      MYSQL_DATABASE: identity
      MYSQL_USER: identity
      MYSQL_PASSWORD: identity_pw
    ports:
      - "13308:3306"
    volumes:
      - identity-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      ConnectionStrings__IdentityDb: "Server=identity-db;Port=3306;Database=identity;User Id=identity;Password=identity_pw;AllowPublicKeyRetrieval=True"
    ports:
      - "5105:8080"
    depends_on:
      identity-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  catalog-db-data:
  orders-db-data:
  identity-db-data:
